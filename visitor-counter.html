<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visitor counter</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
      }

      body {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 2px 0;
        font: 600 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #4a5b63;
        white-space: nowrap;
      }

      /* The counter script writes "<br><img>" — keep it on one line. */
      br {
        display: none;
      }

      a {
        color: #0f766e;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      img {
        display: block;
        border: 0;
      }
    </style>
  </head>
  <body>
    <a href="https://www.versicherungen.at/auslandsversicherung-rechner/">Auslandsversicherung</a>
    <script
      type="text/javascript"
      src="https://www.freevisitorcounters.com/auth.php?id=3c8c105924fbf4e8803cd003b89e0694e0c1cf7f"
    ></script>
    <script
      type="text/javascript"
      src="https://www.freevisitorcounters.com/en/home/counter/1710194/t/2"
    ></script>
    <script>
      // Keep the counter working but never let it link away from the app.
      // The vendor's auth script reads the link above during `load`, so the
      // cleanup is deferred until after that handler has run.
      (function () {
        function disableLinks() {
          var links = document.querySelectorAll('a');
          for (var i = 0; i < links.length; i += 1) {
            var link = links[i];
            link.removeAttribute('href');
            link.removeAttribute('target');
            link.removeAttribute('rel');
            link.setAttribute('tabindex', '-1');
            link.style.pointerEvents = 'none';
            link.style.cursor = 'default';
            link.style.textDecoration = 'none';
          }
        }

        document.addEventListener(
          'click',
          function (event) {
            var target = event.target;
            if (target && target.closest && target.closest('a')) {
              event.preventDefault();
              event.stopPropagation();
            }
          },
          true
        );

        window.addEventListener('load', function () {
          setTimeout(disableLinks, 0);
        });
      })();
    </script>
  </body>
</html>
